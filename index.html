<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Preventivi ISFA Unlimited</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F5870" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#2F5870;
  --navy-dark:#203B4C;
  --coral:#F06449;
  --coral-soft:#FFF0EB;
  --paper:#F5F7F8;
  --card:#FFFFFF;
  --line:#E3EAEE;
  --text:#1D2F3A;
  --muted:#7E8E98;
  --input:#F1F5F7;
}
*{box-sizing:border-box}
html,body,#root{width:100%;height:100%;overscroll-behavior:none}
html{background:var(--paper);overflow:hidden}
body{margin:0;overflow:hidden;background:var(--paper);font-family:'Poppins',Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit}
button{cursor:pointer}
.font-mono{font-family:'Poppins',Arial,sans-serif!important}
.app-shell{height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;background:
  radial-gradient(circle at 100% 0%,rgba(47,88,112,.08),transparent 28%),
  radial-gradient(circle at 0% 42%,rgba(240,100,73,.06),transparent 24%),
  var(--paper)}
.app-topbar{position:sticky;top:0;z-index:30;padding:12px 14px 4px;background:linear-gradient(180deg,rgba(245,247,248,.98),rgba(245,247,248,.90),rgba(245,247,248,0));backdrop-filter:blur(12px)}
.topbar-inner{background:var(--navy);border-radius:24px;padding:16px 18px;color:white;display:flex;align-items:center;gap:12px;box-shadow:0 14px 35px rgba(32,59,76,.18);position:relative;overflow:hidden}
.topbar-inner:before,.topbar-inner:after{content:'';position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:999px}
.topbar-inner:before{width:90px;height:90px;right:-24px;top:-45px}
.topbar-inner:after{width:55px;height:55px;right:44px;bottom:-36px}
.brand-mark{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.header-kicker{font-size:10px;letter-spacing:.08em;opacity:.72;margin-bottom:2px}
.header-title{font-size:18px;font-weight:700;line-height:1.1}
.header-action{margin-left:auto;width:38px;height:38px;border:0;border-radius:13px;background:var(--coral);color:white;font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 20px rgba(240,100,73,.28);position:relative;z-index:2}
.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:40;width:min(calc(100% - 24px),640px);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border:1px solid rgba(227,234,238,.9);border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:0 18px 50px rgba(32,59,76,.17)}
.nav-button{border:0;background:transparent;color:var(--muted);border-radius:16px;padding:9px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;transition:.2s ease}
.nav-button svg{width:20px;height:20px;stroke:currentColor}
.nav-button.active{background:var(--coral-soft);color:var(--coral)}
.page-content{padding-top:8px;padding-bottom:110px}
.hero-card{position:relative;overflow:hidden;background:var(--navy);color:white;border-radius:26px;padding:22px;margin-bottom:18px;box-shadow:0 16px 34px rgba(47,88,112,.18)}
.hero-card:before{content:'';position:absolute;width:140px;height:140px;border-radius:50%;border:26px solid rgba(255,255,255,.06);right:-46px;top:-52px}
.hero-card:after{content:'';position:absolute;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.05);right:78px;bottom:-38px}
.hero-eyebrow{font-size:11px;font-weight:600;opacity:.72;margin-bottom:7px}
.hero-title{font-size:25px;font-weight:800;line-height:1.16;max-width:390px;letter-spacing:-.02em}
.hero-copy{font-size:12px;line-height:1.6;opacity:.78;max-width:470px;margin-top:8px}
.hero-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:600;margin-top:14px}
.ui-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(32,59,76,.055)}
.ui-card-title{display:flex;align-items:center;gap:9px;color:var(--navy-dark);font-size:13px;font-weight:700;margin-bottom:15px}
.ui-card-title:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px var(--coral-soft)}
.field-label{color:var(--navy-dark);font-size:11px;font-weight:600;margin-bottom:7px}
.modern-input{width:100%;border-radius:14px;padding:12px 13px;font-size:13px;outline:none;background:var(--input);border:1px solid transparent;color:var(--text);transition:.2s ease}
.modern-input::placeholder{color:#A9B4BB}
.modern-input:focus{background:white;border-color:rgba(240,100,73,.55);box-shadow:0 0 0 4px rgba(240,100,73,.10)}
.primary-btn{background:var(--coral);color:white;border:0;border-radius:15px;padding:13px 16px;font-size:12px;font-weight:700;box-shadow:0 10px 24px rgba(240,100,73,.22);transition:.2s ease}
.primary-btn:active{transform:translateY(1px)}
.secondary-btn{background:white;color:var(--navy-dark);border:1px solid var(--line);border-radius:15px;padding:12px 15px;font-size:11px;font-weight:600}
.segmented{background:var(--input);padding:4px;border-radius:14px;display:flex;gap:4px}
.segmented button{border:0;border-radius:11px;padding:9px 10px;font-size:11px;font-weight:600;transition:.2s ease}
.summary-card{background:linear-gradient(145deg,#FFFFFF,#F8FAFB);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(32,59,76,.07)}
.total-row{background:var(--navy);color:white;border-radius:16px;padding:14px 15px;margin-top:14px}
.quote-card{transition:.2s ease}
.quote-card:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(32,59,76,.09)}
@media (min-width:700px){.app-topbar{padding-top:20px}.topbar-inner{padding:18px 22px}.page-content{padding-top:12px}.hero-card{padding:28px}.hero-title{font-size:30px}}
</style>
</head>
<body>
<div id="root"></div>

<script>
// storage shim: same interface as Claude artifacts, backed by real localStorage
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const C = {
  ink: "#F5F7F8", card: "#FFFFFF", cardBorder: "#E3EAEE", paper: "#FFFFFF",
  paperLine: "#E3EAEE", red: "#F06449", amber: "#2F5870", textLight: "#1D2F3A",
  muted: "#7E8E98", inputBg: "#F1F5F7", navy: "#2F5870", navyDark: "#203B4C",
};

const defaultSettings = {
  businessName: "ISFA Unlimited", ownerName: "", piva: "", address: "", email: "", phone: "",
  rateShoot: 35, rateEdit: 30, fuelConsumption: 8, fuelPrice: 1.75, taxiAvgCost: 15,
  marginDefault: 10,
  vatNote: "Operazione effettuata da soggetto in regime forfettario, IVA non addebitata (art.1 c.54-89 L.190/2014).",
  paymentTerms: "Acconto 30% all'accettazione del preventivo, saldo alla consegna del lavoro.",
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function eur(n){ return (isFinite(n)?n:0).toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }

const emptyQuote = () => ({
  id: uid(), createdAt: new Date().toISOString(),
  clientName: "", projectTitle: "", projectDesc: "",
  shootHours: 0, editHours: 0, extras: [],
  travelEnabled: false, travelMode: "car",
  kmRoundTrip: 0, tolls: 0, transitCost: 0, taxiTrips: 0, overnightCost: 0,
  marginPerc: 10, discount: 0, notes: "",
});

function computeQuote(d, s) {
  const lines = [];
  if (Number(d.shootHours) > 0) lines.push({ label: `Riprese sul set (${d.shootHours} h × ${eur(s.rateShoot)}/h)`, amount: d.shootHours*s.rateShoot });
  if (Number(d.editHours) > 0) lines.push({ label: `Montaggio e post-produzione (${d.editHours} h × ${eur(s.rateEdit)}/h)`, amount: d.editHours*s.rateEdit });
  if (d.travelEnabled) {
    if (d.travelMode === "car") {
      const fuelCost = (Number(d.kmRoundTrip)/100)*Number(s.fuelConsumption)*Number(s.fuelPrice);
      if (fuelCost > 0) lines.push({ label: `Carburante trasferta (${d.kmRoundTrip} km, ${s.fuelConsumption} L/100km)`, amount: fuelCost });
      if (Number(d.tolls) > 0) lines.push({ label: "Pedaggi autostradali", amount: Number(d.tolls) });
    } else {
      if (Number(d.transitCost) > 0) lines.push({ label: "Mezzi pubblici / treno", amount: Number(d.transitCost) });
    }
    if (Number(d.taxiTrips) > 0) lines.push({ label: `Taxi (${d.taxiTrips} corse × ${eur(s.taxiAvgCost)})`, amount: d.taxiTrips*s.taxiAvgCost });
    if (Number(d.overnightCost) > 0) lines.push({ label: "Pernottamento", amount: Number(d.overnightCost) });
  }
  d.extras.forEach((e) => { if (Number(e.amount) > 0) lines.push({ label: e.label || "Voce extra", amount: Number(e.amount) }); });
  const subtotal = lines.reduce((a,l)=>a+l.amount,0);
  const marginAmount = subtotal * ((Number(d.marginPerc)||0)/100);
  const total = Math.max(0, subtotal + marginAmount - (Number(d.discount)||0));
  return { lines, subtotal, marginAmount, total };
}

function downloadPDF(quote, s) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFont("helvetica","bold"); doc.setFontSize(18);
  doc.text(s.businessName || "Preventivo", 15, y); y+=7;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  [s.ownerName, s.piva ? "P.IVA " + s.piva : "", s.address, [s.email,s.phone].filter(Boolean).join(" - ")]
    .filter(Boolean).forEach(line => { doc.text(line, 15, y); y += 5; });
  doc.setFontSize(9);
  doc.text("Data: " + new Date(quote.createdAt).toLocaleDateString("it-IT"), 150, 20);
  doc.text("N. " + quote.id.slice(-6).toUpperCase(), 150, 25);
  y += 4; doc.setDrawColor(200); doc.line(15,y,195,y); y += 8;
  doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text("Cliente: " + quote.clientName, 15, y); y += 6;
  doc.text("Progetto: " + (quote.projectTitle || "-"), 15, y); y += 8;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  if (quote.projectDesc) { const d2 = doc.splitTextToSize(quote.projectDesc, 180); doc.text(d2,15,y); y += d2.length*5+3; }
  y += 2;
  quote.lines.forEach((l,i) => {
    doc.setFontSize(9); doc.text(`TAKE ${String(i+1).padStart(2,"0")}`, 15, y);
    doc.setFontSize(10);
    const label = doc.splitTextToSize(l.label, 125);
    doc.text(label, 45, y);
    doc.text(eur(l.amount), 195, y, { align: "right" });
    y += Math.max(6, label.length*5);
  });
  y += 4; doc.line(15,y,195,y); y += 6;
  doc.setFontSize(10);
  doc.text("Subtotale",150,y); doc.text(eur(quote.subtotal),195,y,{align:"right"}); y+=6;
  doc.text(`Margine (${quote.marginPerc}%)`,150,y); doc.text(eur(quote.marginAmount),195,y,{align:"right"}); y+=6;
  if (Number(quote.discount) > 0) { doc.text("Sconto",150,y); doc.text("-"+eur(quote.discount),195,y,{align:"right"}); y+=6; }
  doc.setFont("helvetica","bold"); doc.setFontSize(13);
  doc.text("TOTALE",150,y); doc.text(eur(quote.total),195,y,{align:"right"}); y += 10;
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  if (quote.notes) { const n2 = doc.splitTextToSize("Note: " + quote.notes, 180); doc.text(n2,15,y); y += n2.length*5+3; }
  const terms = doc.splitTextToSize(s.paymentTerms || "", 180); doc.text(terms,15,y); y += terms.length*5+3;
  doc.setFontSize(8); doc.setTextColor(120);
  const vat = doc.splitTextToSize(s.vatNote || "", 180); doc.text(vat,15,y);
  doc.save(`Preventivo_${(quote.clientName||"cliente").replace(/\s+/g,"_")}_${quote.id.slice(-6)}.pdf`);
}

function Field({ label, children, hint }) {
  return (
    <label className="block mb-4">
      <div className="field-label">{label}</div>
      {children}
      {hint && <div style={{ color: C.muted }} className="text-[10px] mt-1.5 leading-relaxed">{hint}</div>}
    </label>
  );
}
const inputStyle = {};
const inputCls = "modern-input";
function NumInput(props){ return <input type="number" style={inputStyle} className={inputCls} {...props} />; }
function TxtInput(props){ return <input type="text" style={inputStyle} className={inputCls} {...props} />; }
function TxtArea(props){ return <textarea style={inputStyle} className={inputCls} rows={3} {...props} />; }
function Card({ children, title, className="" }) {
  return (
    <div className={`ui-card ${className}`}>
      {title && <div className="ui-card-title">{title}</div>}
      {children}
    </div>
  );
}

function NavIcon({ name }) {
  const common = { fill: "none", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  if (name === "new") return <svg viewBox="0 0 24 24" {...common}><path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="6"/></svg>;
  if (name === "list") return <svg viewBox="0 0 24 24" {...common}><path d="M8 6h10M8 12h10M8 18h10"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg>;
  return <svg viewBox="0 0 24 24" {...common}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V20h-3v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.08 15a1.7 1.7 0 0 0-1.55-1H5.4v-3h.13a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06A1.7 1.7 0 0 0 10.74 6a1.7 1.7 0 0 0 1-1.55V4.4h3v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.55 1h.09v3h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>;
}

function Header({ tab, setTab, businessName }) {
  const tabs = [{ id: "new", label: "Nuovo" }, { id: "list", label: "Preventivi" }, { id: "settings", label: "Impostazioni" }];
  const titles = { new: "Crea preventivo", list: "I tuoi preventivi", settings: "Impostazioni" };
  return (
    <>
      <header className="app-topbar">
        <div className="max-w-2xl mx-auto topbar-inner">
          <div className="brand-mark">Q</div>
          <div className="relative z-[2] min-w-0">
            <div className="header-kicker truncate">{businessName || "La tua attività"}</div>
            <div className="header-title">{titles[tab] || "Preventivi"}</div>
          </div>
          <button className="header-action" onClick={() => setTab("new")} aria-label="Nuovo preventivo">+</button>
        </div>
      </header>
      <nav className="bottom-nav" aria-label="Navigazione principale">
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} className={`nav-button ${tab===t.id ? "active" : ""}`}>
            <NavIcon name={t.id}/><span>{t.label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}

function SettingsForm({ settings, onSave, saveMsg }) {
  const [s, setS] = useState(settings);
  useEffect(() => setS(settings), [settings]);
  const set = (k) => (e) => setS((p) => ({ ...p, [k]: e.target.value }));
  return (
    <div>
      <div className="hero-card">
        <div className="hero-eyebrow">CONFIGURAZIONE</div>
        <div className="hero-title">Imposta una volta, riutilizza sempre.</div>
        <div className="hero-copy">Dati aziendali, tariffe e condizioni vengono inseriti automaticamente nei prossimi preventivi.</div>
      </div>
      <Card title="Dati azienda (compaiono sul preventivo)">
        <Field label="Ragione / nome"><TxtInput value={s.businessName} onChange={set("businessName")} /></Field>
        <Field label="Titolare"><TxtInput value={s.ownerName} onChange={set("ownerName")} /></Field>
        <Field label="Partita IVA"><TxtInput value={s.piva} onChange={set("piva")} /></Field>
        <Field label="Indirizzo"><TxtInput value={s.address} onChange={set("address")} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Email"><TxtInput value={s.email} onChange={set("email")} /></Field>
          <Field label="Telefono"><TxtInput value={s.phone} onChange={set("phone")} /></Field>
        </div>
      </Card>
      <Card title="Tariffe base">
        <div className="grid grid-cols-2 gap-3">
          <Field label="€/h riprese"><NumInput value={s.rateShoot} onChange={set("rateShoot")} /></Field>
          <Field label="€/h montaggio"><NumInput value={s.rateEdit} onChange={set("rateEdit")} /></Field>
        </div>
      </Card>
      <Card title="Trasferta — auto">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Consumo (L/100km)"><NumInput value={s.fuelConsumption} onChange={set("fuelConsumption")} /></Field>
          <Field label="Prezzo carburante €/L"><NumInput step="0.01" value={s.fuelPrice} onChange={set("fuelPrice")} /></Field>
        </div>
        <Field label="Costo medio a corsa taxi (€)"><NumInput value={s.taxiAvgCost} onChange={set("taxiAvgCost")} /></Field>
      </Card>
      <Card title="Default preventivo">
        <Field label="Margine / imprevisti di default (%)"><NumInput value={s.marginDefault} onChange={set("marginDefault")} /></Field>
        <Field label="Nota IVA (regime forfettario)"><TxtArea value={s.vatNote} onChange={set("vatNote")} /></Field>
        <Field label="Termini di pagamento"><TxtArea value={s.paymentTerms} onChange={set("paymentTerms")} /></Field>
      </Card>
      <button onClick={() => onSave(s)} className="w-full primary-btn">
        Salva impostazioni
      </button>
      {saveMsg && <div style={{ color: C.navy }} className="text-center text-xs mt-3 font-semibold">{saveMsg}</div>}
    </div>
  );
}

function NewQuoteForm({ draft, update, addExtra, updateExtra, removeExtra, calc, onGenerate, onReset }) {
  const canGenerate = draft.clientName.trim() && calc.lines.length > 0;
  return (
    <div>
      <div className="hero-card">
        <div className="hero-eyebrow">PREVENTIVO SMART</div>
        <div className="hero-title">Trasforma il lavoro in un prezzo chiaro.</div>
        <div className="hero-copy">Inserisci cliente, ore, spese e servizi extra. Il totale si aggiorna automaticamente mentre lavori.</div>
        <div className="hero-chip"><span style={{width:7,height:7,borderRadius:99,background:C.red,display:"inline-block"}}></span> Salvataggio rapido e PDF pronto</div>
      </div>
      <Card title="Cliente e progetto">
        <Field label="Nome cliente"><TxtInput value={draft.clientName} onChange={(e) => update({ clientName: e.target.value })} /></Field>
        <Field label="Titolo progetto"><TxtInput value={draft.projectTitle} onChange={(e) => update({ projectTitle: e.target.value })} /></Field>
        <Field label="Descrizione breve"><TxtArea value={draft.projectDesc} onChange={(e) => update({ projectDesc: e.target.value })} /></Field>
      </Card>
      <Card title="Lavorazione">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Ore di riprese"><NumInput value={draft.shootHours} onChange={(e) => update({ shootHours: e.target.value })} /></Field>
          <Field label="Ore di montaggio"><NumInput value={draft.editHours} onChange={(e) => update({ editHours: e.target.value })} /></Field>
        </div>
      </Card>
      <Card title="Trasferta">
        <label className="flex items-center gap-2 mb-3">
          <input type="checkbox" checked={draft.travelEnabled} onChange={(e) => update({ travelEnabled: e.target.checked })} />
          <span style={{ color: C.textLight }} className="text-sm">C'è una trasferta per questo lavoro</span>
        </label>
        {draft.travelEnabled && (
          <>
            <div className="segmented mb-3">
              {["car","transit"].map((m) => (
                <button key={m} onClick={() => update({ travelMode: m })} className="flex-1"
                  style={draft.travelMode===m ? {background:C.red,color:"#fff",boxShadow:"0 5px 14px rgba(240,100,73,.18)"} : {background:"transparent",color:C.muted}}>
                  {m === "car" ? "Auto" : "Mezzi"}
                </button>
              ))}
            </div>
            {draft.travelMode === "car" ? (
              <div className="grid grid-cols-2 gap-3">
                <Field label="Km totali (A/R)"><NumInput value={draft.kmRoundTrip} onChange={(e) => update({ kmRoundTrip: e.target.value })} /></Field>
                <Field label="Pedaggi (€)"><NumInput value={draft.tolls} onChange={(e) => update({ tolls: e.target.value })} /></Field>
              </div>
            ) : (
              <Field label="Costo biglietto/treno (€)"><NumInput value={draft.transitCost} onChange={(e) => update({ transitCost: e.target.value })} /></Field>
            )}
            <div className="grid grid-cols-2 gap-3 mt-3">
              <Field label="N. corse taxi"><NumInput value={draft.taxiTrips} onChange={(e) => update({ taxiTrips: e.target.value })} /></Field>
              <Field label="Pernottamento (€)"><NumInput value={draft.overnightCost} onChange={(e) => update({ overnightCost: e.target.value })} /></Field>
            </div>
          </>
        )}
      </Card>
      <Card title="Voci extra">
        {draft.extras.map((ex) => (
          <div key={ex.id} className="flex gap-2 mb-2 items-center">
            <TxtInput placeholder="Es. drone, musica..." value={ex.label} onChange={(e) => updateExtra(ex.id, { label: e.target.value })} />
            <div className="w-24"><NumInput value={ex.amount} onChange={(e) => updateExtra(ex.id, { amount: e.target.value })} /></div>
            <button onClick={() => removeExtra(ex.id)} style={{ color: C.red }} className="font-mono text-xs px-2">✕</button>
          </div>
        ))}
        <button onClick={addExtra} style={{ color: C.amber }} className="font-mono text-xs mt-1">+ aggiungi voce</button>
      </Card>
      <Card title="Margine e note">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Margine / imprevisti (%)"><NumInput value={draft.marginPerc} onChange={(e) => update({ marginPerc: e.target.value })} /></Field>
          <Field label="Sconto (€)"><NumInput value={draft.discount} onChange={(e) => update({ discount: e.target.value })} /></Field>
        </div>
        <Field label="Note per il cliente"><TxtArea value={draft.notes} onChange={(e) => update({ notes: e.target.value })} /></Field>
      </Card>
      <div className="summary-card"><div className="ui-card-title">Riepilogo</div>
        {calc.lines.length === 0 && <div style={{ color: C.muted }} className="text-sm">Compila ore o trasferta per vedere il totale.</div>}
        {calc.lines.map((l, i) => (
          <div key={i} className="flex justify-between text-sm mb-1">
            <span style={{ color: C.textLight }}>{l.label}</span>
            <span style={{ color: C.textLight }} className="font-mono">{eur(l.amount)}</span>
          </div>
        ))}
        <div style={{ borderTop: `1px solid ${C.cardBorder}` }} className="mt-2 pt-2 flex justify-between text-sm">
          <span style={{ color: C.muted }}>Subtotale</span><span style={{ color: C.muted }} className="font-mono">{eur(calc.subtotal)}</span>
        </div>
        <div className="flex justify-between text-sm">
          <span style={{ color: C.muted }}>Margine ({draft.marginPerc || 0}%)</span><span style={{ color: C.muted }} className="font-mono">{eur(calc.marginAmount)}</span>
        </div>
        <div className="total-row flex justify-between items-center">
          <span className="text-xs font-semibold opacity-75">TOTALE PREVENTIVO</span><span className="text-xl font-extrabold">{eur(calc.total)}</span>
        </div>
      </div>
      <div className="flex gap-2">
        <button onClick={onReset} className="flex-1 secondary-btn">Svuota</button>
        <button disabled={!canGenerate} onClick={onGenerate} style={{ opacity: canGenerate ? 1 : .48 }}
          className="flex-[2] primary-btn">
          Genera preventivo
        </button>
      </div>
    </div>
  );
}

function QuoteList({ quotes, onView, onDelete }) {
  return (
    <div>
      <div className="hero-card">
        <div className="hero-eyebrow">ARCHIVIO</div>
        <div className="hero-title">Tutto sotto controllo.</div>
        <div className="hero-copy">Riapri, scarica o elimina i preventivi già creati senza perderti tra mille file.</div>
        <div className="hero-chip">{quotes.length} {quotes.length === 1 ? "preventivo salvato" : "preventivi salvati"}</div>
      </div>
      {quotes.length === 0 && <div className="ui-card text-center py-10"><div className="text-3xl mb-3">📄</div><div style={{color:C.textLight}} className="font-semibold mb-1">Nessun preventivo ancora</div><div style={{color:C.muted}} className="text-xs">Il primo comparirà qui appena lo generi.</div></div>}
      {quotes.map((q) => (
        <Card key={q.id} className="quote-card">
          <div className="flex justify-between items-start">
            <div>
              <div style={{ color: C.textLight }} className="font-bold">{q.clientName}</div>
              <div style={{ color: C.muted }} className="text-xs">{q.projectTitle || "—"} · {new Date(q.createdAt).toLocaleDateString("it-IT")}</div>
            </div>
            <div style={{ color: C.amber }} className="font-mono font-bold">{eur(q.total)}</div>
          </div>
          <div className="flex gap-2 mt-3">
            <button onClick={() => onView(q)} className="flex-1 secondary-btn">Apri preventivo</button>
            <button onClick={() => onDelete(q.id)} style={{ color: C.red }} className="px-3 text-xs font-semibold">Elimina</button>
          </div>
        </Card>
      ))}
    </div>
  );
}

function QuoteView({ quote, onBack, onDelete }) {
  const s = quote.businessSnapshot || defaultSettings;
  return (
    <div className="app-shell min-h-screen pb-8">
      <div className="max-w-2xl mx-auto px-4 pt-4 flex gap-2">
        <button onClick={onBack} className="secondary-btn">← Indietro</button>
        <button onClick={() => downloadPDF(quote, s)} className="flex-1 primary-btn">Scarica PDF</button>
        <button onClick={onDelete} className="secondary-btn" style={{color:C.red}}>Elimina</button>
      </div>
      <div style={{ background: C.paper, color: "#211F1D" }} className="max-w-2xl mx-auto my-5 rounded-[24px] overflow-hidden shadow-xl border border-slate-200">
        <div style={{ height: 14, background: C.navy }} />
        <div className="p-6">
          <div className="flex justify-between items-start mb-6">
            <div>
              <div style={{ color: C.red }} className="font-mono text-[10px] tracking-[0.3em]">PREVENTIVO</div>
              <div className="text-2xl font-black tracking-tight">{s.businessName}</div>
              {s.ownerName && <div className="text-xs" style={{ color: "#6B6558" }}>{s.ownerName}</div>}
              {s.piva && <div className="text-xs" style={{ color: "#6B6558" }}>P.IVA {s.piva}</div>}
              {s.address && <div className="text-xs" style={{ color: "#6B6558" }}>{s.address}</div>}
              <div className="text-xs" style={{ color: "#6B6558" }}>{[s.email, s.phone].filter(Boolean).join(" · ")}</div>
            </div>
            <div className="text-right font-mono text-xs" style={{ color: "#6B6558" }}>
              <div>DATA: {new Date(quote.createdAt).toLocaleDateString("it-IT")}</div>
              <div>N°: {quote.id.slice(-6).toUpperCase()}</div>
            </div>
          </div>
          <div style={{ borderTop: `1px solid ${C.paperLine}`, borderBottom: `1px solid ${C.paperLine}` }} className="py-3 mb-4 grid grid-cols-2 gap-3 text-xs">
            <div><span style={{ color: "#6B6558" }}>CLIENTE </span><div className="font-bold text-sm">{quote.clientName}</div></div>
            <div><span style={{ color: "#6B6558" }}>PROGETTO </span><div className="font-bold text-sm">{quote.projectTitle || "—"}</div></div>
          </div>
          {quote.projectDesc && <div className="text-sm mb-4" style={{ color: "#3A362E" }}>{quote.projectDesc}</div>}
          <table className="w-full text-sm mb-4">
            <tbody>
              {quote.lines.map((l, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${C.paperLine}` }}>
                  <td className="py-2 font-mono text-xs" style={{ color: "#6B6558", width: 70 }}>TAKE {String(i+1).padStart(2,"0")}</td>
                  <td className="py-2">{l.label}</td>
                  <td className="py-2 text-right font-mono">{eur(l.amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="flex flex-col items-end gap-1 mb-4">
            <div className="flex justify-between w-48 text-xs" style={{ color: "#6B6558" }}><span>Subtotale</span><span className="font-mono">{eur(quote.subtotal)}</span></div>
            <div className="flex justify-between w-48 text-xs" style={{ color: "#6B6558" }}><span>Margine ({quote.marginPerc}%)</span><span className="font-mono">{eur(quote.marginAmount)}</span></div>
            {Number(quote.discount) > 0 && <div className="flex justify-between w-48 text-xs" style={{ color: "#6B6558" }}><span>Sconto</span><span className="font-mono">-{eur(quote.discount)}</span></div>}
            <div className="flex justify-between w-48 text-lg font-black pt-1" style={{ borderTop: "1px solid #1C1B1A" }}><span>TOTALE</span><span className="font-mono">{eur(quote.total)}</span></div>
          </div>
          {quote.notes && <div className="text-xs mb-3" style={{ color: "#3A362E" }}><b>Note:</b> {quote.notes}</div>}
          <div className="text-xs mb-1" style={{ color: "#6B6558" }}>{s.paymentTerms}</div>
          <div className="text-xs italic" style={{ color: "#9C9585" }}>{s.vatNote}</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [settings, setSettings] = useState(defaultSettings);
  const [quotes, setQuotes] = useState([]);
  const [tab, setTab] = useState("new");
  const [draft, setDraft] = useState(emptyQuote());
  const [viewingQuote, setViewingQuote] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveMsg, setSaveMsg] = useState("");

  useEffect(() => {
    (async () => {
      try { const s = await window.storage.get("settings"); if (s && s.value) setSettings({ ...defaultSettings, ...JSON.parse(s.value) }); } catch (e) {}
      try {
        const idx = await window.storage.get("quotes-index");
        if (idx && idx.value) {
          const ids = JSON.parse(idx.value); const loaded = [];
          for (const id of ids) { try { const q = await window.storage.get("quote:"+id); if (q && q.value) loaded.push(JSON.parse(q.value)); } catch (e) {} }
          loaded.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
          setQuotes(loaded);
        }
      } catch (e) {}
      setLoading(false);
    })();
  }, []);

  async function saveSettings(next) {
    setSettings(next);
    try { await window.storage.set("settings", JSON.stringify(next)); setSaveMsg("Impostazioni salvate ✓"); setTimeout(() => setSaveMsg(""), 2000); } catch (e) {}
  }
  async function saveQuote(q) {
    try {
      await window.storage.set("quote:"+q.id, JSON.stringify(q));
      const ids = Array.from(new Set([q.id, ...quotes.map((x) => x.id)]));
      await window.storage.set("quotes-index", JSON.stringify(ids));
      setQuotes((prev) => { const others = prev.filter((x) => x.id !== q.id); return [q, ...others].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); });
    } catch (e) {}
  }
  async function deleteQuote(id) {
    try {
      await window.storage.delete("quote:"+id);
      const ids = quotes.filter((x) => x.id !== id).map((x) => x.id);
      await window.storage.set("quotes-index", JSON.stringify(ids));
      setQuotes((prev) => prev.filter((x) => x.id !== id));
      if (viewingQuote && viewingQuote.id === id) { setViewingQuote(null); setTab("list"); }
    } catch (e) {}
  }

  const calc = useMemo(() => computeQuote(draft, settings), [draft, settings]);
  function updateDraft(patch) { setDraft((prev) => ({ ...prev, ...patch })); }
  function addExtra() { setDraft((prev) => ({ ...prev, extras: [...prev.extras, { id: uid(), label: "", amount: 0 }] })); }
  function updateExtra(id, patch) { setDraft((prev) => ({ ...prev, extras: prev.extras.map((e) => (e.id === id ? { ...e, ...patch } : e)) })); }
  function removeExtra(id) { setDraft((prev) => ({ ...prev, extras: prev.extras.filter((e) => e.id !== id) })); }

  async function generate() {
    const snapshot = { ...draft, lines: calc.lines, total: calc.total, subtotal: calc.subtotal, marginAmount: calc.marginAmount, businessSnapshot: settings };
    await saveQuote(snapshot);
    setViewingQuote(snapshot);
    setDraft(emptyQuote());
    setTab("view");
  }

  if (loading) return <div className="app-shell flex items-center justify-center"><div style={{ color: C.navy }} className="text-sm font-semibold">Caricamento…</div></div>;
  if (tab === "view" && viewingQuote) return <QuoteView quote={viewingQuote} onBack={() => { setTab("list"); setViewingQuote(null); }} onDelete={() => deleteQuote(viewingQuote.id)} />;

  return (
    <div className="app-shell text-sm">
      <Header tab={tab} setTab={setTab} businessName={settings.businessName} />
      <div className="max-w-2xl mx-auto px-4 page-content">
        {tab === "settings" && <SettingsForm settings={settings} onSave={saveSettings} saveMsg={saveMsg} />}
        {tab === "new" && <NewQuoteForm draft={draft} update={updateDraft} addExtra={addExtra} updateExtra={updateExtra} removeExtra={removeExtra} calc={calc} onGenerate={generate} onReset={() => setDraft(emptyQuote())} />}
        {tab === "list" && <QuoteList quotes={quotes} onView={(q) => { setViewingQuote(q); setTab("view"); }} onDelete={deleteQuote} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
