.hero-eyebrow{font-size:10px;font-weight:600;opacity:.7;margin-bottom:7px;letter-spacing:.08em}.hero-title{font-size:26px;font-weight:800;line-height:1.16;max-width:450px;letter-spacing:-.025em;position:relative;z-index:2}.hero-copy{font-size:11px;line-height:1.6;opacity:.78;max-width:500px;margin-top:8px;position:relative;z-index:2}

.ui-card-title{display:flex;align-items:center;gap:9px;color:var(--navy-dark);font-size:13px;font-weight:700;margin-bottom:15px}.ui-card-title:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px var(--coral-soft);flex:0 0 auto}
.field-label{color:var(--navy-dark);font-size:10.5px;font-weight:600;margin-bottom:7px}.field-hint{color:var(--muted);font-size:9.5px;line-height:1.5;margin-top:6px}.modern-input{width:100%;border-radius:14px;padding:12px 13px;font-size:12.5px;outline:none;background:var(--input);border:1px solid transparent;color:var(--text);transition:.2s ease;min-height:44px}.modern-input::placeholder{color:#A9B4BB}.modern-input:focus{background:#fff;border-color:rgba(240,100,73,.55);box-shadow:0 0 0 4px rgba(240,100,73,.10)}
.primary-btn,.secondary-btn,.danger-btn{color:#fff;border:0;border-radius:15px;font-weight:700;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}.primary-btn{background:var(--navy);padding:13px 16px;font-size:12px;box-shadow:0 10px 23px rgba(47,88,112,.24)}.secondary-btn{background:var(--blue);padding:12px 15px;font-size:11px;box-shadow:0 8px 19px rgba(55,109,136,.20)}.danger-btn{background:var(--blue);padding:12px 15px;font-size:11px;box-shadow:0 8px 19px rgba(55,109,136,.20)}.primary-btn:active,.secondary-btn:active,.danger-btn:active{transform:scale(.975);filter:brightness(.96)}.primary-btn:disabled,.secondary-btn:disabled,.danger-btn:disabled{opacity:.48;box-shadow:none}
.dashboard-actions{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:15px}.action-card{border:0;border-radius:23px;padding:19px;text-align:left;position:relative;overflow:hidden;min-height:126px;box-shadow:0 12px 28px rgba(32,59,76,.11)}.action-card.primary{background:var(--coral);color:#fff}.action-card.secondary{background:#fff;color:var(--navy-dark);border:1px solid var(--line)}.action-icon{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:22px;margin-bottom:14px}.action-card.primary .action-icon{background:rgba(255,255,255,.17)}.action-card.secondary .action-icon{background:var(--coral-soft);color:var(--coral)}.action-title{font-size:16px;font-weight:800;line-height:1.2}.action-copy{font-size:10px;opacity:.72;margin-top:4px;max-width:240px}.action-arrow{position:absolute;right:18px;bottom:16px;font-size:20px;font-weight:500}

.service-panel{border:1px solid var(--blue-border);border-radius:18px;padding:14px;margin-bottom:12px;background:linear-gradient(145deg,#fff,#fbfdfe);transition:.2s ease;box-shadow:0 6px 16px rgba(32,59,76,.035)}.service-panel.enabled{border-color:rgba(55,109,136,.42);box-shadow:0 10px 24px rgba(32,59,76,.075)}.service-toggle-row{display:flex;align-items:center;gap:11px;cursor:pointer}.service-toggle-row input,.included-option input,.addon-toggle input,.meal-toggle input{accent-color:var(--blue);width:17px;height:17px;flex:0 0 auto}.service-name{font-size:13px;font-weight:700;color:var(--navy-dark)}.service-description{font-size:9.5px;color:var(--muted);line-height:1.45;margin-top:2px}.service-body{padding-top:14px;margin-top:13px;border-top:1px solid var(--line)}.included-title{font-size:9.5px;font-weight:700;color:var(--navy-dark);margin-bottom:9px;text-transform:uppercase;letter-spacing:.05em}.included-grid{display:grid;grid-template-columns:1fr;gap:7px}.included-option-block{border:1px solid var(--blue-border);border-radius:13px;background:#fff;overflow:hidden}.included-option-block.active{border-color:rgba(55,109,136,.38);box-shadow:0 5px 13px rgba(32,59,76,.05)}.included-option{display:flex;align-items:center;gap:9px;padding:10px;background:#fff;font-size:10.5px;color:var(--text);cursor:pointer}.subservice-hours{padding:0 10px 10px;background:#FBFDFE}.subservice-hours .field-label{margin-top:2px}.rate-preview{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--blue-soft);border-radius:12px;padding:10px 11px;margin-top:9px;font-size:10px;color:var(--navy-dark)}.rate-preview strong{font-size:12px}
.money-input{position:relative}.money-input:before{content:'€';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--navy);z-index:1}.money-input .modern-input{padding-left:30px}.hours-input{position:relative}.hours-input:after{content:'ore';position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--muted);pointer-events:none}.hours-input .modern-input{padding-right:48px}
.addon-row{padding:12px 0;border-bottom:1px solid var(--line)}.addon-row:last-child{border-bottom:0}.addon-main{display:flex;align-items:center;gap:10px}.addon-toggle{display:flex;align-items:center;gap:9px;min-width:0;flex:1;cursor:pointer}.addon-label{font-size:12px;font-weight:600;color:var(--navy-dark)}.addon-controls{padding:12px 0 2px 27px}.segmented{background:var(--input);padding:4px;border-radius:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.segmented button{border:0;border-radius:11px;padding:9px 7px;font-size:9.5px;font-weight:700;color:var(--blue);background:transparent}.segmented button.active{background:var(--blue);color:#fff;box-shadow:0 5px 13px rgba(55,109,136,.22)}
.travel-block{background:#F9FBFC;border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px}.travel-section-title{font-size:10px;font-weight:700;color:var(--navy-dark);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}.travel-section-title:first-child{margin-top:0}.meal-grid{display:grid;grid-template-columns:1fr;gap:8px}.meal-row{display:flex;align-items:center;gap:8px}.meal-toggle{display:flex;align-items:center;gap:8px;flex:1;font-size:10.5px;font-weight:600}.meal-cost{width:116px}
.summary-card{background:linear-gradient(145deg,#FFFFFF,#F8FAFB);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(32,59,76,.07)}.summary-item{padding:9px 0;border-bottom:1px solid var(--line)}.summary-item:last-of-type{border-bottom:0}.summary-line-main{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:22px;align-items:start;font-size:12px}.summary-line-price{font-weight:700;white-space:nowrap;text-align:right;margin-left:8px}.summary-subitems{font-size:9.5px;color:var(--muted);line-height:1.65;margin-top:5px;padding-left:12px}.summary-total-line{display:flex;justify-content:flex-end;gap:9px;font-size:12px;margin-top:10px;color:var(--muted)}.total-row{background:var(--navy);color:white;border-radius:16px;padding:14px 15px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:18px}.total-row span:first-child{font-size:10px;font-weight:700;opacity:.78}.total-row span:last-child{font-size:19px;font-weight:800;white-space:nowrap}
.list-card{background:#fff;border:1px solid var(--blue-border);border-radius:19px;padding:15px;margin-bottom:11px;box-shadow:0 11px 26px rgba(32,59,76,.075);transition:transform .16s ease,box-shadow .16s ease}.list-card.interactive:active{transform:scale(.982);box-shadow:0 6px 15px rgba(32,59,76,.09)}.list-title{font-size:13px;font-weight:700;color:var(--navy-dark)}.list-meta{font-size:9.5px;color:var(--muted);margin-top:3px}.list-amount{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--blue-soft);color:var(--blue);font-size:9px;font-weight:700}.empty-state{text-align:center;padding:38px 20px;background:#fff;border:1px solid var(--blue-border);border-radius:22px;box-shadow:0 10px 24px rgba(32,59,76,.06)}.empty-icon{font-size:34px;margin-bottom:10px}.empty-title{font-size:13px;font-weight:700;color:var(--navy-dark)}.empty-copy{font-size:10px;color:var(--muted);margin-top:4px}
.client-picker-row{width:100%;border:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 2px;display:flex;align-items:center;gap:12px;text-align:left}.client-picker-row:last-child{border-bottom:0}.avatar{width:40px;height:40px;border-radius:14px;background:var(--blue-soft);color:var(--blue);border:1px solid rgba(55,109,136,.12);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}.client-name{font-size:12.5px;font-weight:700;color:var(--navy-dark)}.client-card-head{display:flex;align-items:center;gap:12px}.client-card-copy{min-width:0;flex:1}.rates-grid{display:grid;grid-template-columns:1fr;gap:0 12px}
.notice{border-radius:15px;padding:11px 12px;font-size:9.5px;line-height:1.55;background:#EFF6F8;color:var(--navy-dark);border:1px solid #DCE9EE;margin-bottom:14px}.warning{background:#FFF8E8;border-color:#F3E1B2;color:#695526}
.logo-box{border:1px dashed #C9D5DB;border-radius:17px;padding:14px;text-align:center;background:#FBFCFD}.logo-preview{max-width:170px;max-height:80px;display:block;margin:0 auto 12px;object-fit:contain}.upload-label{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;border-radius:13px;padding:10px 13px;font-size:10.5px;font-weight:700;cursor:pointer}.upload-label input{display:none}
.quote-paper{background:#fff;color:#211F1D;border:1px solid #E2E6E8;border-radius:23px;overflow:hidden;box-shadow:0 18px 45px rgba(32,59,76,.12)}.quote-paper-top{height:13px;background:var(--navy)}.quote-paper.internal .quote-paper-top{background:var(--coral)}.quote-paper-body{padding:22px}.quote-logo{max-width:125px;max-height:55px;object-fit:contain;margin-bottom:8px}.quote-subitems{font-size:9.5px;line-height:1.6;color:#6B6558;margin-top:4px}.view-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#EAF0F3;border-radius:15px;padding:4px;margin-bottom:12px}.view-switch button{border:0;border-radius:12px;padding:10px 8px;background:transparent;color:var(--blue);font-size:10.5px;font-weight:700}.view-switch button.active{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(55,109,136,.20)}.internal-banner{background:var(--coral-soft);color:#A33C29;border:1px solid #F7C8BE;border-radius:13px;padding:9px 11px;margin-bottom:15px;font-size:9.5px;font-weight:700;text-align:center;letter-spacing:.025em}.quote-line{display:grid;grid-template-columns:55px minmax(0,1fr) auto;column-gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #E2E6E8}.quote-line-price{font-size:12px;font-weight:600;white-space:nowrap;text-align:right;margin-left:8px}
.uppercase-input{text-transform:uppercase;letter-spacing:.035em}

.tax-breakdown-title{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

.tax-breakdown-note{font-size:8.5px;line-height:1.45;color:#8A98A1;margin-top:9px}

.two-col{display:grid;grid-template-columns:1fr;gap:0 12px}.three-col{display:grid;grid-template-columns:1fr;gap:0 12px}.action-footer{display:flex;gap:9px;position:static;margin-top:16px;padding:0 0 calc(8px + env(safe-area-inset-bottom));background:transparent;z-index:auto}.save-toast{text-align:center;color:var(--success);font-size:10.5px;font-weight:700;margin-top:10px}

/* Motion system */
button,.menu-row,.list-card,.ui-card,.service-panel,.client-picker-row{will-change:transform}
button,.menu-row,.list-card.interactive,.client-picker-row{transition:transform .16s cubic-bezier(.22,.8,.32,1),box-shadow .18s ease,filter .18s ease}
button:active,.menu-row:active,.list-card.interactive:active,.client-picker-row:active{transform:scale(.972);filter:brightness(.975)}
.gesture-stack{position:relative;width:100%;min-height:100vh;min-height:100svh;min-height:100dvh;isolation:isolate;contain:paint}
.screen-stage{position:relative;z-index:2;width:100%;min-height:100vh;min-height:100svh;min-height:100dvh;transform:translate3d(0,0,0);animation:screenEnter .22s cubic-bezier(.22,.8,.32,1) both;transform-origin:center top;background:radial-gradient(circle at 100% 0%,rgba(47,88,112,.08),transparent 28%),radial-gradient(circle at 0% 42%,rgba(240,100,73,.06),transparent 24%),var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;contain:paint}
.screen-stage.no-enter{animation:none!important}
.screen-stage.is-swiping{animation:none!important;transition:none!important;transform:translate3d(var(--swipe-x,0px),0,0);box-shadow:-14px 0 34px rgba(22,44,57,.16);will-change:transform}
.screen-stage.is-settling{animation:none!important;transition:transform var(--settle-ms,300ms) cubic-bezier(.32,.72,0,1),box-shadow var(--settle-ms,300ms) cubic-bezier(.32,.72,0,1)!important;transform:translate3d(var(--swipe-x,0px),0,0);will-change:transform}
.swipe-preview{position:fixed;inset:0;z-index:1;overflow:hidden;visibility:hidden;pointer-events:none;background:var(--paper);transform:translate3d(-24vw,0,0);opacity:1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;contain:paint}
.swipe-preview.is-visible{visibility:visible}
.swipe-preview.is-swiping{transition:none!important;transform:translate3d(var(--preview-x,-24vw),0,0);will-change:transform}
.swipe-preview.is-settling{transition:transform var(--settle-ms,300ms) cubic-bezier(.32,.72,0,1)!important;transform:translate3d(var(--preview-x,-24vw),0,0);will-change:transform}
.swipe-preview-shell{width:100%;height:100%;min-height:100vh;min-height:100svh;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 100% 0%,rgba(47,88,112,.08),transparent 28%),radial-gradient(circle at 0% 42%,rgba(240,100,73,.06),transparent 24%),var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.swipe-preview-shade{position:absolute;inset:0;z-index:40;background:rgba(18,38,49,.12);opacity:var(--preview-shade,.12);transition:none;pointer-events:none;will-change:opacity}
.swipe-preview.is-settling .swipe-preview-shade{transition:opacity var(--settle-ms,300ms) cubic-bezier(.32,.72,0,1)}

<script>
window.storage = {
  async get(key){ const value=localStorage.getItem(key); if(value===null) throw new Error('not found'); return {key,value}; },
  async set(key,value){ localStorage.setItem(key,value); return {key,value}; },
  async delete(key){ localStorage.removeItem(key); return {key,deleted:true}; }

</script>
<script type="text/babel" data-presets="react">
const { useEffect, useLayoutEffect, useMemo, useRef, useState } = React;
const C={navy:'#2F5870',navyDark:'#203B4C',coral:'#F06449',muted:'#7E8E98',line:'#E3EAEE',text:'#1D2F3A'};

const defaultSettings={
  businessName:'ISFA Unlimited', ownerName:'', piva:'', fiscalCode:'', address:'', city:'', postalCode:'', province:'', email:'', pec:'', phone:'', website:'', iban:'', logoDataUrl:'',
  rateVideoShooting:35, rateVideoEditing:30, ratePhotography:30, ratePhotoPostProduction:30,
  taxPercentage:0,
  fuelConsumption:8, fuelPrice:1.75,
  quoteValidityDays:30,
  vatNote:'Operazione effettuata da soggetto in regime forfettario, IVA non addebitata (art.1 c.54-89 L.190/2014).',
  paymentTerms:"Acconto 30% all'accettazione del preventivo, saldo alla consegna del lavoro."
};

const blankClient=()=>({
  id:uid(), createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
  firstName:'', lastName:'', businessName:'', piva:'', fiscalCode:'', phone:'', email:'', pec:'', sdi:'', address:'', city:'', postalCode:'', province:'', notes:''
});

const serviceDefinitions=[
  {id:'shooting',title:'Riprese video',description:'Inserisci le ore previste. Il prezzo viene calcolato con la tariffa salvata nelle impostazioni.',rateKey:'rateVideoShooting',items:[
    {id:'location',label:'Riprese in location / sul set',enabled:true},{id:'drone',label:'Riprese con il drone',enabled:false},{id:'multi-camera',label:'Riprese multicamera',enabled:false},{id:'direction',label:'Direzione sul set',enabled:false}
  ]},
  {id:'editing',title:'Montaggio video',description:'Le sottovoci spiegano cosa è incluso, ma non modificano il prezzo.',rateKey:'rateVideoEditing',items:[
    {id:'assembly',label:'Montaggio e assemblaggio',enabled:true},{id:'color-correction',label:'Color correction',enabled:false},{id:'color-grading',label:'Color grading',enabled:false},{id:'sound-design',label:'Sound design',enabled:false},{id:'audio-cleanup',label:'Pulizia audio',enabled:false},{id:'motion-graphics',label:'Motion graphics',enabled:false},{id:'voice-over',label:'Voice over',enabled:false},{id:'ai-video',label:'Uso di AI per la creazione video',enabled:false}
  ]},
  {id:'photography',title:'Fotografie',description:'Inserisci le ore dedicate allo shooting e alla lavorazione delle fotografie.',rateKey:'ratePhotography',items:[
    {id:'photo-shooting',label:'Shooting fotografico',enabled:true},{id:'photo-selection',label:'Selezione e cernita degli scatti',enabled:false},{id:'photo-postproduction',label:'Post-produzione e ottimizzazione delle immagini',enabled:false,hours:0},{id:'photo-color',label:'Color correction fotografica',enabled:false},{id:'photo-retouch',label:'Ritocco fotografico',enabled:false},{id:'photo-export',label:'Esportazione e consegna',enabled:false}
  ]}
];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function eur(value){return (Number.isFinite(Number(value))?Number(value):0).toLocaleString('it-IT',{style:'currency',currency:'EUR'})}
function qty(value){return n(value).toLocaleString('it-IT',{maximumFractionDigits:2})}
function n(value){const parsed=Number(value);return Number.isFinite(parsed)?parsed:0}
function clampPercentage(value){return Math.min(100,Math.max(0,n(value)))}
function taxSummary(total,percentage){const gross=n(total);const taxPercentage=clampPercentage(percentage);const taxAmount=gross*taxPercentage/100;return {gross,taxPercentage,taxAmount,netPercentage:100-taxPercentage,netAmount:gross-taxAmount}}
function currentStoredTaxPercentage(){try{const raw=JSON.parse(localStorage.getItem('settings')||'{}');return clampPercentage(raw.taxPercentage)}catch(error){return clampPercentage(defaultSettings.taxPercentage)}}
function quoteTaxPercentage(quote){const snapshotValue=quote?.businessSnapshot?.taxPercentage;return snapshotValue===undefined||snapshotValue===null?currentStoredTaxPercentage():clampPercentage(snapshotValue)}
function clone(value){return JSON.parse(JSON.stringify(value))}
function clientDisplayName(client){
  const person=[client?.firstName,client?.lastName].filter(Boolean).join(' ').trim();
  return person || (client?.businessName||'').trim() || 'Cliente senza nome';
}
function initials(client){return clientDisplayName(client).split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase()||'CL'}
function addressLine(data){return [data.address,[data.postalCode,data.city].filter(Boolean).join(' '),data.province].filter(Boolean).join(', ')}
function buildServices(){return serviceDefinitions.map(service=>({...clone(service),enabled:false,hours:0,items:service.items.map(item=>({...item}))}))}
function mergeServices(savedServices=[]){return buildServices().map(base=>{const saved=savedServices.find(service=>service.id===base.id);if(!saved)return base;return {...base,...saved,items:base.items.map(item=>{const savedItem=(saved.items||[]).find(old=>old.id===item.id||old.label===item.label);return savedItem?{...item,...savedItem}:item})}})}
function blankTravel(){return {enabled:false,transport:'car',km:0,tolls:0,otherTransportCost:0,taxiEnabled:false,taxiCost:0,overnightEnabled:false,overnightCost:0,meals:{breakfast:{enabled:false,cost:0},lunch:{enabled:false,cost:0},dinner:{enabled:false,cost:0}}}}
function blankAddons(){return {equipmentRental:{enabled:false,amount:0},musicLicense:{enabled:false,amount:0},soundLicense:{enabled:false,amount:0},aiUsage:{enabled:false,amount:0},expressDelivery:{enabled:false,option:'72 ore',amount:0}}}
function emptyQuote(client=null){return {
  id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),clientId:client?.id||null,client:client?clone(client):blankClient(),
  projectTitle:'',projectDesc:'',services:buildServices(),videoDeliverables:0,photoDeliverables:0,travel:blankTravel(),addons:blankAddons(),extras:[],discount:0,notes:''
}}
function normalizeSettings(settings){const raw=settings||{};return {...defaultSettings,...raw,fiscalCode:String(raw.fiscalCode||'').toUpperCase(),taxPercentage:clampPercentage(raw.taxPercentage??defaultSettings.taxPercentage),rateVideoShooting:raw.rateVideoShooting??raw.rateShoot??defaultSettings.rateVideoShooting,rateVideoEditing:raw.rateVideoEditing??raw.rateEdit??defaultSettings.rateVideoEditing,ratePhotography:raw.ratePhotography??raw.ratePhoto??defaultSettings.ratePhotography,ratePhotoPostProduction:raw.ratePhotoPostProduction??raw.ratePhotoEditing??defaultSettings.ratePhotoPostProduction}}
function normalizeClient(client){const normalized={...blankClient(),...(client||{}),id:client?.id||uid()};normalized.fiscalCode=String(normalized.fiscalCode||'').toUpperCase();return normalized}

function normalizeDraftFromQuote(quote,settings){
  if(quote?.appVersion>=3 && quote.services){
    return {...clone(quote),client:normalizeClient(quote.clientSnapshot||quote.client),services:mergeServices(quote.services),travel:{...blankTravel(),...(quote.travel||{}),meals:{...blankTravel().meals,...(quote.travel?.meals||{})}},addons:{...blankAddons(),...(quote.addons||{})},extras:quote.extras||[]};
  }
  const draft=emptyQuote(normalizeClient({id:quote?.clientId||uid(),firstName:quote?.clientName||''}));
  draft.id=quote.id||uid(); draft.createdAt=quote.createdAt||new Date().toISOString(); draft.projectTitle=quote.projectTitle||''; draft.projectDesc=quote.projectDesc||''; draft.discount=quote.discount||0; draft.notes=quote.notes||'';
  const oldGroups=quote.serviceGroups||[];
  draft.services=draft.services.map(service=>{
    const old=oldGroups.find(group=>group.id===service.id || (service.id==='editing'&&group.id==='video-editing') || (service.id==='shooting'&&group.id==='shooting') || (service.id==='photography'&&group.id==='photography'));
    if(!old)return service;
    const rate=n(settings[service.rateKey]);
    return {...service,enabled:!!old.enabled,hours:rate>0?n(old.amount)/rate:0,items:service.items.map(item=>({...item,enabled:old.items?.some(oldItem=>oldItem.id===item.id?oldItem.enabled:oldItem.label===item.label)??item.enabled}))};
  });
  const oldAdditional=quote.additionalServices||[];
  const findAmount=(id)=>n(oldAdditional.find(item=>item.id===id)?.amount);
  draft.addons.equipmentRental={enabled:findAmount('equipment-rental')>0,amount:findAmount('equipment-rental')};
  draft.addons.musicLicense={enabled:findAmount('music-license')>0,amount:findAmount('music-license')};
  draft.addons.soundLicense={enabled:findAmount('sound-license')>0,amount:findAmount('sound-license')};
  draft.addons.aiUsage={enabled:findAmount('ai-usage')>0,amount:findAmount('ai-usage')};
  draft.addons.expressDelivery={enabled:findAmount('express-delivery')>0,option:'72 ore',amount:findAmount('express-delivery')};
  draft.extras=quote.extras||[];
  return draft;
}

function lineItemsForMode(line,mode='client'){
  const fallback=Array.isArray(line?.items)?line.items:[];
  if(mode==='internal')return Array.isArray(line?.internalItems)&&line.internalItems.length?line.internalItems:fallback;
  if(line?.id==='travel')return [];
  return Array.isArray(line?.clientItems)?line.clientItems:fallback;
}

function calculateQuote(draft,settings){
  const lines=[];
  const enabledServices=(draft.services||[]).filter(service=>service.enabled);
  const shooting=enabledServices.find(service=>service.id==='shooting');
  const editing=enabledServices.find(service=>service.id==='editing');
  const photography=enabledServices.find(service=>service.id==='photography');
  enabledServices.forEach(service=>{
    const rate=n(settings[service.rateKey]);
    let amount=n(service.hours)*rate;
    const selected=(service.items||[]).filter(item=>item.enabled).map(item=>item.label);
    const excluded=(service.items||[]).filter(item=>!item.enabled).map(item=>item.label);
    const clientItems=[...selected];
    if(service.id==='editing' && n(draft.videoDeliverables)>0) clientItems.push(`Consegna: ${n(draft.videoDeliverables)} ${n(draft.videoDeliverables)===1?'video finale':'video finali'}`);
    if(service.id==='shooting' && !editing && n(draft.videoDeliverables)>0) clientItems.push(`Consegna: ${n(draft.videoDeliverables)} ${n(draft.videoDeliverables)===1?'video grezzo':'video grezzi'}`);
    if(service.id==='photography' && n(draft.photoDeliverables)>0) clientItems.push(`Consegna: ${n(draft.photoDeliverables)} ${n(draft.photoDeliverables)===1?'fotografia finale':'fotografie finali'}`);
    const internalItems=[service.id==='photography'?`Ore shooting fotografico: ${qty(service.hours)}`:`Ore previste: ${qty(service.hours)}`,service.id==='photography'?`Tariffa shooting: ${eur(rate)}/h`:`Tariffa oraria: ${eur(rate)}/h`];
    if(service.id==='photography'){
      const post=(service.items||[]).find(item=>item.id==='photo-postproduction');
      if(post?.enabled){
        const postRate=n(settings.ratePhotoPostProduction);
        const postAmount=n(post.hours)*postRate;
        amount+=postAmount;
        internalItems.push(`Ore post-produzione: ${qty(post.hours)}`);
        internalItems.push(`Tariffa post-produzione: ${eur(postRate)}/h`);
      }
    }
    internalItems.push(...clientItems);
    if(excluded.length)internalItems.push(`Non incluso: ${excluded.join(', ')}`);
    if(amount>0)lines.push({id:service.id,label:service.title,amount,items:clientItems,clientItems,internalItems,type:'service'});
  });

  const travel=draft.travel||blankTravel();
  if(travel.enabled){
    let travelAmount=0; const internalItems=[];
    if(travel.transport==='car'){
      const fuel=(n(travel.km)/100)*n(settings.fuelConsumption)*n(settings.fuelPrice); travelAmount+=fuel+n(travel.tolls);
      if(n(travel.km)>0)internalItems.push(`Spostamento in auto: ${qty(travel.km)} km`);
      if(fuel>0)internalItems.push(`Carburante: ${eur(fuel)}`);
      if(n(travel.tolls)>0)internalItems.push(`Pedaggi: ${eur(n(travel.tolls))}`);
    }else{
      travelAmount+=n(travel.otherTransportCost);
      if(n(travel.otherTransportCost)>0)internalItems.push(`Altro mezzo di trasporto: ${eur(n(travel.otherTransportCost))}`);
    }
    if(travel.taxiEnabled&&n(travel.taxiCost)>0){travelAmount+=n(travel.taxiCost);internalItems.push(`Taxi / spostamenti sul posto: ${eur(n(travel.taxiCost))}`)}
    if(travel.overnightEnabled&&n(travel.overnightCost)>0){travelAmount+=n(travel.overnightCost);internalItems.push(`Pernottamento: ${eur(n(travel.overnightCost))}`)}
    const mealLabels={breakfast:'Colazione',lunch:'Pranzo',dinner:'Cena'};
    Object.entries(travel.meals||{}).forEach(([key,meal])=>{if(meal.enabled&&n(meal.cost)>0){travelAmount+=n(meal.cost);internalItems.push(`${mealLabels[key]}: ${eur(n(meal.cost))}`)}});
    if(travelAmount>0)lines.push({id:'travel',label:'Trasferta',amount:travelAmount,items:[],clientItems:[],internalItems,type:'additional'});
  }

  const addons=draft.addons||blankAddons();
  const simpleAddons=[['equipmentRental','Noleggio attrezzature'],['musicLicense','Licenza musica'],['soundLicense','Licenza suoni']];
  simpleAddons.forEach(([key,label])=>{const item=addons[key];if(item?.enabled&&n(item.amount)>0)lines.push({id:key,label,amount:n(item.amount),items:[],clientItems:[],internalItems:[],type:'additional'})});
  if(addons.aiUsage?.enabled&&n(addons.aiUsage.amount)>0)lines.push({id:'aiUsage',label:'Utilizzo di AI',amount:n(addons.aiUsage.amount),items:[],clientItems:[],internalItems:['Costo di abbonamenti, crediti o strumenti AI attribuito al progetto'],type:'additional'});
  if(addons.expressDelivery?.enabled&&n(addons.expressDelivery.amount)>0){const deliveryItems=[`Tempistica: ${addons.expressDelivery.option}`];lines.push({id:'expressDelivery',label:'Consegna express',amount:n(addons.expressDelivery.amount),items:deliveryItems,clientItems:deliveryItems,internalItems:deliveryItems,type:'additional'})}
  (draft.extras||[]).forEach(extra=>{if(n(extra.amount)>0)lines.push({id:extra.id,label:extra.label||'Voce personalizzata',amount:n(extra.amount),items:[],clientItems:[],internalItems:[],type:'additional'})});
  const subtotal=lines.reduce((sum,line)=>sum+n(line.amount),0); const discount=Math.max(0,n(draft.discount)); const total=Math.max(0,subtotal-discount);
  return {lines,subtotal,discount,total,hasVideo:!!(shooting||editing),videoIsFinal:!!editing,hasPhotography:!!photography};
}

async function resizeLogo(file){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error('file mancante'));return}
    const reader=new FileReader();
    reader.onload=()=>{const image=new Image();image.onload=()=>{const maxW=1000,maxH=450,scale=Math.min(1,maxW/image.width,maxH/image.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/png',.9))};image.onerror=reject;image.src=reader.result};
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

function LongPressCard({children,onLongPress,className=''}){
  const timer=useRef(null);const start=useRef(null);const fired=useRef(false);
  const clear=()=>{if(timer.current){clearTimeout(timer.current);timer.current=null}start.current=null};
  const onPointerDown=event=>{if(event.pointerType==='mouse'&&event.button!==0)return;if(event.target.closest('button,input,textarea,select,label,a'))return;fired.current=false;start.current={x:event.clientX,y:event.clientY};timer.current=setTimeout(()=>{fired.current=true;onLongPress?.()},560)};
  const onPointerMove=event=>{if(!start.current)return;if(Math.hypot(event.clientX-start.current.x,event.clientY-start.current.y)>11)clear()};
  const onPointerUp=()=>clear();
  return <div className={`long-press-card ${className}`} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={clear} onContextMenu={event=>event.preventDefault()}>{children}</div>
}

function TravelForm({travel,settings,onChange}){
  const update=patch=>onChange({...travel,...patch});
  const updateMeal=(key,patch)=>onChange({...travel,meals:{...travel.meals,[key]:{...travel.meals[key],...patch}}});
  const fuelCost=(n(travel.km)/100)*n(settings.fuelConsumption)*n(settings.fuelPrice);
  const labels={breakfast:'Colazione',lunch:'Pranzo',dinner:'Cena'};
  return <div className="travel-block">
    <div className="travel-section-title">Mezzo di trasporto</div>
    <div className="segmented"><button className={travel.transport==='car'?'active':''} onClick={()=>update({transport:'car'})}>Auto</button><button className={travel.transport==='other'?'active':''} onClick={()=>update({transport:'other'})}>Altro mezzo</button></div>
    {travel.transport==='car'?<div className="mt-3"><div className="two-col"><Field label="Km totali da percorrere"><NumInput min="0" step="1" value={travel.km} onChange={event=>update({km:event.target.value})}/></Field><Field label="Pedaggi / caselli (€)"><div className="money-input"><NumInput min="0" step="0.01" value={travel.tolls} onChange={event=>update({tolls:event.target.value})}/></div></Field></div><div className="rate-preview"><span>Carburante calcolato con {settings.fuelConsumption} L/100 km e {eur(settings.fuelPrice)}/L</span><strong>{eur(fuelCost)}</strong></div></div>:<Field label="Costo biglietti / spostamento"><div className="money-input"><NumInput min="0" step="0.01" value={travel.otherTransportCost} onChange={event=>update({otherTransportCost:event.target.value})}/></div></Field>}
    <div className="travel-section-title">Altre spese</div>
    <div className="addon-row"><div className="addon-main"><label className="addon-toggle"><input type="checkbox" checked={travel.taxiEnabled} onChange={event=>update({taxiEnabled:event.target.checked})}/><span className="addon-label">Taxi / spostamenti sul posto</span></label></div>{travel.taxiEnabled&&<div className="addon-controls"><Field label="Costo totale taxi"><div className="money-input"><NumInput min="0" step="0.01" value={travel.taxiCost} onChange={event=>update({taxiCost:event.target.value})}/></div></Field></div>}</div>
    <div className="addon-row"><div className="addon-main"><label className="addon-toggle"><input type="checkbox" checked={travel.overnightEnabled} onChange={event=>update({overnightEnabled:event.target.checked})}/><span className="addon-label">Pernottamento</span></label></div>{travel.overnightEnabled&&<div className="addon-controls"><Field label="Costo pernottamento"><div className="money-input"><NumInput min="0" step="0.01" value={travel.overnightCost} onChange={event=>update({overnightCost:event.target.value})}/></div></Field></div>}</div>
    <div className="travel-section-title">Pasti</div><div className="meal-grid">{Object.entries(labels).map(([key,label])=>{const meal=travel.meals[key];return <div key={key} className="meal-row"><label className="meal-toggle"><input type="checkbox" checked={meal.enabled} onChange={event=>updateMeal(key,{enabled:event.target.checked})}/><span>{label}</span></label>{meal.enabled&&<div className="money-input meal-cost"><NumInput min="0" step="0.01" value={meal.cost} onChange={event=>updateMeal(key,{cost:event.target.value})}/></div>}</div>})}</div>
  </div>
}

function AddonRow({label,item,onChange,children}){return <div className="addon-row"><div className="addon-main"><label className="addon-toggle"><input type="checkbox" checked={item.enabled} onChange={event=>onChange({...item,enabled:event.target.checked})}/><span className="addon-label">{label}</span></label></div>{item.enabled&&<div className="addon-controls">{children||<Field label="Costo"><div className="money-input"><NumInput min="0" step="0.01" value={item.amount} onChange={event=>onChange({...item,amount:event.target.value})}/></div></Field>}</div>}</div>}

function QuoteForm({draft,settings,mode,onDraft,onSave,onCancel}){
  const calc=useMemo(()=>calculateQuote(draft,settings),[draft,settings]);
  const update=patch=>onDraft({...draft,...patch});
  const updateClient=client=>update({client});
  const updateService=(id,patch)=>update({services:draft.services.map(service=>service.id===id?{...service,...patch}:service)});
  const updateServiceItem=(serviceId,itemId,patch)=>update({services:draft.services.map(service=>service.id!==serviceId?service:{...service,items:service.items.map(item=>item.id===itemId?{...item,...patch}:item)})});
  const updateAddon=(key,value)=>update({addons:{...draft.addons,[key]:value}});
  const addExtra=()=>update({extras:[...draft.extras,{id:uid(),label:'',amount:0}]});
  const updateExtra=(id,patch)=>update({extras:draft.extras.map(extra=>extra.id===id?{...extra,...patch}:extra)});
  const canSave=clientDisplayName(draft.client)!=='Cliente senza nome'&&calc.lines.length>0;
  const activeRates=draft.services.filter(service=>service.enabled&&n(settings[service.rateKey])<=0);
  const photoPostActive=draft.services.find(service=>service.id==='photography')?.items?.find(item=>item.id==='photo-postproduction')?.enabled;
  const missingPhotoPostRate=photoPostActive&&n(settings.ratePhotoPostProduction)<=0;
  return <div className="pt-2">
    <Card title="Dati cliente"><ClientFields client={draft.client} onChange={updateClient} existingMode={mode==='existing'||mode==='edit'}/></Card>
    <Card title="Progetto"><Field label="Titolo progetto"><TxtInput value={draft.projectTitle} onChange={event=>update({projectTitle:event.target.value})} placeholder="Es. Produzione video campagna estate"/></Field><Field label="Descrizione breve"><TxtArea value={draft.projectDesc} onChange={event=>update({projectDesc:event.target.value})} placeholder="Descrivi in poche righe il lavoro concordato"/></Field></Card>
    <Card title="Servizi principali">
      {(activeRates.length>0||missingPhotoPostRate)&&<div className="notice warning">Una delle tariffe attive è impostata a 0 €. Controlla la sezione Impostazioni prima di generare il preventivo.</div>}
      {draft.services.map(service=><ServicePanel key={service.id} service={service} settings={settings} onUpdate={patch=>updateService(service.id,patch)} onUpdateItem={(itemId,patch)=>updateServiceItem(service.id,itemId,patch)}/>)}
      {calc.hasVideo&&<Field label={calc.videoIsFinal?'Quanti video finali verranno consegnati?':'Quanti video grezzi verranno consegnati?'}><NumInput min="0" step="1" value={draft.videoDeliverables} onChange={event=>update({videoDeliverables:event.target.value})}/></Field>}
      {calc.hasPhotography&&<Field label="Quante fotografie finali verranno consegnate?"><NumInput min="0" step="1" value={draft.photoDeliverables} onChange={event=>update({photoDeliverables:event.target.value})}/></Field>}
    </Card>
    <Card title="Costi e servizi aggiuntivi">
      <AddonRow label="Trasferta" item={draft.travel} onChange={travel=>update({travel})}><TravelForm travel={draft.travel} settings={settings} onChange={travel=>update({travel})}/></AddonRow>
      <AddonRow label="Noleggio attrezzature" item={draft.addons.equipmentRental} onChange={value=>updateAddon('equipmentRental',value)}/>
      <AddonRow label="Licenza musica" item={draft.addons.musicLicense} onChange={value=>updateAddon('musicLicense',value)}/>
      <AddonRow label="Licenza suoni" item={draft.addons.soundLicense} onChange={value=>updateAddon('soundLicense',value)}/>
      <AddonRow label="Utilizzo di AI" item={draft.addons.aiUsage} onChange={value=>updateAddon('aiUsage',value)}><Field label="Costo abbonamenti / crediti AI" hint="Inserisci la quota di strumenti AI che vuoi attribuire a questo progetto."><div className="money-input"><NumInput min="0" step="0.01" value={draft.addons.aiUsage.amount} onChange={event=>updateAddon('aiUsage',{...draft.addons.aiUsage,amount:event.target.value})}/></div></Field></AddonRow>
      <AddonRow label="Consegna express" item={draft.addons.expressDelivery} onChange={value=>updateAddon('expressDelivery',value)}><div><div className="field-label">Tempistica</div><div className="segmented mb-3">{['24 ore','72 ore','1 settimana','15 giorni'].map(option=><button key={option} className={draft.addons.expressDelivery.option===option?'active':''} onClick={()=>updateAddon('expressDelivery',{...draft.addons.expressDelivery,option})}>{option}</button>)}</div><Field label="Costo consegna express"><div className="money-input"><NumInput min="0" step="0.01" value={draft.addons.expressDelivery.amount} onChange={event=>updateAddon('expressDelivery',{...draft.addons.expressDelivery,amount:event.target.value})}/></div></Field></div></AddonRow>
    </Card>
    <Card title="Altre voci personalizzate">{draft.extras.map(extra=><div key={extra.id} className="flex gap-2 mb-2 items-center"><TxtInput placeholder="Nome della voce" value={extra.label} onChange={event=>updateExtra(extra.id,{label:event.target.value})}/><div className="money-input w-32"><NumInput min="0" step="0.01" value={extra.amount} onChange={event=>updateExtra(extra.id,{amount:event.target.value})}/></div><button className="danger-btn px-3" onClick={()=>update({extras:draft.extras.filter(item=>item.id!==extra.id)})}>✕</button></div>)}<button className="secondary-btn" onClick={addExtra}>+ Aggiungi voce</button></Card>
    <Card title="Sconto e note"><Field label="Sconto (€)"><div className="money-input"><NumInput min="0" step="0.01" value={draft.discount} onChange={event=>update({discount:event.target.value})}/></div></Field><Field label="Note per il cliente"><TxtArea value={draft.notes} onChange={event=>update({notes:event.target.value})}/></Field></Card>
    <div className="summary-card"><div className="ui-card-title">Riepilogo interno</div>{calc.lines.length===0?<div className="text-xs" style={{color:C.muted}}>Attiva almeno un servizio e inserisci ore o costi.</div>:calc.lines.map(line=>{const detail=lineItemsForMode(line,'internal');return <div key={line.id} className="summary-item"><div className="summary-line-main"><span className="font-semibold">{line.label}</span><span className="summary-line-price">{eur(line.amount)}</span></div>{detail.length>0&&<div className="summary-subitems">{detail.map((item,index)=><div key={`${line.id}-${index}`}>• {item}</div>)}</div>}</div>})}<div className="summary-total-line"><span>Subtotale</span><strong>{eur(calc.subtotal)}</strong></div>{calc.discount>0&&<div className="summary-total-line"><span>Sconto</span><strong style={{color:C.coral}}>-{eur(calc.discount)}</strong></div>}<div className="total-row"><span>TOTALE PREVENTIVO</span><span>{eur(calc.total)}</span></div></div>
    <div className="action-footer"><button className="secondary-btn flex-1" onClick={onCancel}>Annulla</button><button className="primary-btn flex-[2]" disabled={!canSave} style={{opacity:canSave?1:.45}} onClick={()=>onSave(calc)}>{mode==='edit'?'Salva modifiche':'Genera preventivo'}</button></div>
  </div>
}

function QuoteList({quotes,onView,onNew,onLongPress}){return <div><div className="hero-card"><div className="hero-eyebrow">ARCHIVIO</div><div className="hero-title">Tutti i preventivi, sempre a portata di mano.</div><div className="hero-copy">Aprili, modificali oppure scarica di nuovo il PDF quando ti serve.</div></div>{quotes.length===0?<div className="empty-state"><div className="empty-icon">📄</div><div className="empty-title">Nessun preventivo ancora</div><div className="empty-copy">Il primo comparirà qui appena lo generi.</div><button className="primary-btn mt-4" onClick={onNew}>Crea il primo</button></div>:quotes.map(quote=><LongPressCard key={quote.id} className="list-card interactive" onLongPress={()=>onLongPress(quote)}><div className="flex justify-between gap-4 items-start"><div><div className="list-title">{clientDisplayName(quote.clientSnapshot||quote.client||{firstName:quote.clientName})}</div><div className="list-meta">{quote.projectTitle||'Senza titolo'} · {new Date(quote.createdAt).toLocaleDateString('it-IT')}</div></div><div className="list-amount">{eur(quote.total)}</div></div><div className="quote-list-actions"><button className="secondary-btn flex-1" onClick={()=>onView(quote)}>Apri preventivo</button><button className="secondary-btn pdf-btn" onClick={()=>downloadPDF(quote)}>PDF</button></div></LongPressCard>)}</div>}

function QuoteView({quote,onBack,onEdit,onDelete}){
  const [viewMode,setViewMode]=useState('client');
  const settings=normalizeSettings(quote.businessSnapshot);const client=quote.clientSnapshot||quote.client||{firstName:quote.clientName};const internal=viewMode==='internal';const taxes=taxSummary(quote.total,quoteTaxPercentage(quote));
  return <div>
    <div className="flex gap-2 mb-3"><button className="secondary-btn flex-1" onClick={onEdit}>Modifica</button><button className="danger-btn" onClick={onDelete}>Elimina</button></div>
    <div className="view-switch"><button className={!internal?'active':''} onClick={()=>setViewMode('client')}>Vista cliente</button><button className={internal?'active':''} onClick={()=>setViewMode('internal')}>Dettaglio interno</button></div>
    <button className="primary-btn w-full mb-4" onClick={()=>downloadPDF(quote,viewMode)}>{internal?'Scarica PDF interno':'Scarica PDF cliente'}</button>
    <div className={`quote-paper ${internal?'internal':''}`}><div className="quote-paper-top"/><div className="quote-paper-body">
      {internal&&<div className="internal-banner">DOCUMENTO INTERNO · NON INVIARE AL CLIENTE</div>}
      <div className="flex justify-between gap-5 items-start mb-5"><div>{settings.logoDataUrl&&<img className="quote-logo" src={settings.logoDataUrl} alt="Logo"/>}<div className="text-xl font-black">{internal?'Dettaglio interno preventivo':settings.businessName}</div>{internal&&<div className="text-[10px] text-slate-500">{settings.businessName}</div>}{!internal&&settings.ownerName&&<div className="text-[10px] text-slate-500">{settings.ownerName}</div>}{!internal&&settings.piva&&<div className="text-[10px] text-slate-500">P.IVA {settings.piva}</div>}{!internal&&<div className="text-[10px] text-slate-500">{addressLine(settings)}</div>}</div><div className="text-right text-[9px] text-slate-500"><div>{new Date(quote.createdAt).toLocaleDateString('it-IT')}</div><div>N. {String(quote.id).slice(-6).toUpperCase()}</div></div></div>
      <div className="border-y border-slate-200 py-3 mb-4"><div className="text-[9px] text-slate-500">CLIENTE</div><div className="font-bold">{clientDisplayName(client)}</div><div className="text-[9px] text-slate-500 mt-2">PROGETTO</div><div className="font-bold">{quote.projectTitle||'-'}</div></div>
      {quote.projectDesc&&<div className="text-xs mb-4">{quote.projectDesc}</div>}
      <div>{(quote.lines||[]).map((line,index)=>{const items=lineItemsForMode(line,viewMode);return <div key={`${line.id}-${index}`} className="quote-line"><div className="text-[8px] text-slate-500">VOCE {String(index+1).padStart(2,'0')}</div><div><div className="text-xs font-semibold">{line.label}</div>{items.length>0&&<div className="quote-subitems">{items.map((item,itemIndex)=><div key={`${line.id}-${itemIndex}`}>• {item}</div>)}</div>}</div><div className="quote-line-price">{eur(line.amount)}</div></div>})}</div>
      <div className="mt-5 text-right"><div className="text-xs text-slate-500">Subtotale&nbsp;&nbsp;<b>{eur(quote.subtotal)}</b></div>{n(quote.marginAmount)>0&&internal&&<div className="text-xs text-slate-500 mt-1">Margine&nbsp;&nbsp;<b>{eur(quote.marginAmount)}</b></div>}{n(quote.discount)>0&&<div className="text-xs text-slate-500 mt-1">Sconto&nbsp;&nbsp;<b>-{eur(quote.discount)}</b></div>}{!internal&&<div className="text-lg font-black mt-2 text-[#203B4C]">TOTALE PREVENTIVO&nbsp;&nbsp;{eur(quote.total)}</div>}</div>{internal&&<div className="tax-breakdown"><div className="tax-breakdown-title">Ripartizione dell'incasso</div><div className="tax-breakdown-row"><span>Totale lordo · 100%</span><strong>{eur(taxes.gross)}</strong></div><div className="tax-breakdown-row tax-row"><span>Tasse · {qty(taxes.taxPercentage)}%</span><strong>-{eur(taxes.taxAmount)}</strong></div><div className="tax-breakdown-row net-row"><span>Incasso netto · {qty(taxes.netPercentage)}%</span><strong>{eur(taxes.netAmount)}</strong></div><div className="tax-breakdown-note">Stima interna calcolata sulla percentuale fiscale impostata. Non sottrae eventuali altre spese aziendali.</div></div>}
      {!internal&&quote.notes&&<div className="text-[10px] mt-5"><b>Note:</b> {quote.notes}</div>}{!internal&&<><div className="text-[9px] text-slate-500 mt-4">{settings.paymentTerms}</div><div className="text-[8px] text-slate-400 italic mt-1">{settings.vatNote}</div></>}
    </div></div><button className="secondary-btn w-full mt-4" onClick={onBack}>Torna ai preventivi</button>
  </div>
}

function ClientsList({clients,onEdit,onLongPress}){return <div><div className="hero-card"><div className="hero-eyebrow">RUBRICA CLIENTI</div><div className="hero-title">I dati utili, senza inserirli ogni volta.</div><div className="hero-copy">Le modifiche alla scheda cliente valgono per i prossimi preventivi. Quelli già creati restano invariati.</div></div>{clients.length===0?<div className="empty-state"><div className="empty-icon">👥</div><div className="empty-title">Nessun cliente salvato</div><div className="empty-copy">La scheda viene creata quando generi il primo preventivo per un nuovo cliente.</div></div>:clients.map(client=><LongPressCard key={client.id} className="list-card interactive" onLongPress={()=>onLongPress(client)}><div className="client-card-head"><div className="avatar">{initials(client)}</div><div className="client-card-copy"><div className="list-title">{clientDisplayName(client)}</div><div className="list-meta">{client.businessName&&clientDisplayName(client)!==client.businessName?client.businessName:(client.email||client.phone||'Scheda cliente salvata')}</div></div></div><button className="secondary-btn w-full mt-3" onClick={()=>onEdit(client)}>Apri cliente</button></LongPressCard>)}</div>}

function ClientEdit({client,onChange,onSave,onCancel,saveMsg}){return <div><div className="simple-page-title">Modifica cliente</div><div className="notice">Le modifiche verranno usate nei nuovi preventivi. I preventivi già salvati non cambieranno.</div><Card title="Dati personali e fiscali"><ClientFields client={client} onChange={onChange}/><Field label="Note private"><TxtArea value={client.notes} onChange={event=>onChange({...client,notes:event.target.value})} placeholder="Informazioni utili solo per te"/></Field></Card><div className="action-footer"><button className="secondary-btn flex-1" onClick={onCancel}>Annulla</button><button className="primary-btn flex-[2]" onClick={onSave}>Salva cliente</button></div>{saveMsg&&<div className="save-toast">{saveMsg}</div>}</div>}

function SettingsForm({settings,onSave,saveMsg}){
  const [form,setForm]=useState(settings);useEffect(()=>setForm(settings),[settings]);const set=key=>event=>setForm(previous=>({...previous,[key]:event.target.value}));const setUpper=key=>event=>setForm(previous=>({...previous,[key]:event.target.value.toUpperCase()}));
  const handleLogo=async event=>{const file=event.target.files?.[0];if(!file)return;try{const data=await resizeLogo(file);setForm(previous=>({...previous,logoDataUrl:data}))}catch(error){alert('Non sono riuscita a leggere il logo. Prova con PNG o JPG.')}};
  return <div><Card title="Logo del preventivo"><div className="logo-box">{form.logoDataUrl?<img className="logo-preview" src={form.logoDataUrl} alt="Logo attività"/>:<div className="text-xs text-slate-400 mb-3">Nessun logo caricato</div>}<label className="upload-label">Carica logo<input type="file" accept="image/png,image/jpeg,image/webp" onChange={handleLogo}/></label>{form.logoDataUrl&&<button className="danger-btn ml-2" onClick={()=>setForm(previous=>({...previous,logoDataUrl:''}))}>Rimuovi</button>}</div></Card>
    <Card title="Dati della tua attività"><Field label="Nome / ragione sociale"><TxtInput value={form.businessName} onChange={set('businessName')}/></Field><Field label="Titolare"><TxtInput value={form.ownerName} onChange={set('ownerName')}/></Field><div className="two-col"><Field label="Partita IVA"><TxtInput value={form.piva} onChange={set('piva')}/></Field><Field label="Codice fiscale"><UppercaseInput value={form.fiscalCode} onChange={setUpper('fiscalCode')}/></Field></div><Field label="Indirizzo"><TxtInput value={form.address} onChange={set('address')}/></Field><div className="three-col"><Field label="CAP"><TxtInput value={form.postalCode} onChange={set('postalCode')}/></Field><Field label="Città"><TxtInput value={form.city} onChange={set('city')}/></Field><Field label="Provincia"><TxtInput value={form.province} onChange={set('province')}/></Field></div><div className="two-col"><Field label="Email"><TxtInput type="email" value={form.email} onChange={set('email')}/></Field><Field label="PEC"><TxtInput value={form.pec} onChange={set('pec')}/></Field></div><div className="two-col"><Field label="Telefono"><TxtInput value={form.phone} onChange={set('phone')}/></Field><Field label="Sito web"><TxtInput value={form.website} onChange={set('website')}/></Field></div><Field label="IBAN"><TxtInput value={form.iban} onChange={set('iban')} placeholder="Facoltativo"/></Field></Card>
    <Card title="Tariffe orarie"><div className="notice">Queste tariffe servono solo per i calcoli interni. Nel PDF il cliente vedrà esclusivamente il prezzo finale di ogni servizio.</div><div className="rates-grid"><Field label="Riprese video (€ / ora)"><div className="money-input"><NumInput min="0" step="1" value={form.rateVideoShooting} onChange={set('rateVideoShooting')}/></div></Field><Field label="Montaggio video (€ / ora)"><div className="money-input"><NumInput min="0" step="1" value={form.rateVideoEditing} onChange={set('rateVideoEditing')}/></div></Field><Field label="Shooting fotografico (€ / ora)"><div className="money-input"><NumInput min="0" step="1" value={form.ratePhotography} onChange={set('ratePhotography')}/></div></Field><Field label="Post-produzione foto (€ / ora)"><div className="money-input"><NumInput min="0" step="1" value={form.ratePhotoPostProduction} onChange={set('ratePhotoPostProduction')}/></div></Field></div></Card>
    <Card title="Tasse e incasso netto"><Field label="Percentuale da accantonare per le tasse (%)" hint="Viene usata solo nel dettaglio interno. Il cliente continuerà a vedere il totale normale del preventivo."><NumInput min="0" max="100" step="0.1" value={form.taxPercentage} onChange={set('taxPercentage')}/></Field><div className="notice">Con {clampPercentage(form.taxPercentage)}% di tasse, l'incasso netto stimato corrisponde al {100-clampPercentage(form.taxPercentage)}% del totale lordo.</div></Card>
    <Card title="Costi dell'auto"><div className="two-col"><Field label="Consumo medio (L / 100 km)"><NumInput min="0" step="0.1" value={form.fuelConsumption} onChange={set('fuelConsumption')}/></Field><Field label="Prezzo carburante (€ / L)"><div className="money-input"><NumInput min="0" step="0.01" value={form.fuelPrice} onChange={set('fuelPrice')}/></div></Field></div><div className="field-hint">Quando selezioni una trasferta in auto, l'app calcola automaticamente il carburante usando chilometri, consumo e prezzo al litro.</div></Card>
    <Card title="Condizioni del preventivo"><Field label="Termini di pagamento"><TxtArea value={form.paymentTerms} onChange={set('paymentTerms')}/></Field><Field label="Validità del preventivo (giorni)"><NumInput min="0" step="1" value={form.quoteValidityDays} onChange={set('quoteValidityDays')}/></Field><Field label="Nota fiscale / IVA"><TxtArea value={form.vatNote} onChange={set('vatNote')}/></Field></Card>
    <button className="primary-btn w-full" onClick={()=>onSave(normalizeSettings(form))}>Salva impostazioni</button>{saveMsg&&<div className="save-toast">{saveMsg}</div>}
  </div>
}

function App(){
  const [settings,setSettings]=useState(defaultSettings);const [quotes,setQuotes]=useState([]);const [clients,setClients]=useState([]);const [screen,setScreen]=useState('home');const [draft,setDraft]=useState(null);const [draftMode,setDraftMode]=useState('new');const [viewingQuote,setViewingQuote]=useState(null);const [editingClient,setEditingClient]=useState(null);const [loading,setLoading]=useState(true);const [saveMsg,setSaveMsg]=useState('');const [completion,setCompletion]=useState(null);const [actionSheet,setActionSheet]=useState(null);const [skipEntry,setSkipEntry]=useState(false);
  useEffect(()=>{(async()=>{let loadedSettings=defaultSettings;try{const saved=await window.storage.get('settings');loadedSettings=normalizeSettings(JSON.parse(saved.value));setSettings(loadedSettings)}catch(error){}
    let loadedQuotes=[];try{const index=await window.storage.get('quotes-index');const ids=JSON.parse(index.value);for(const id of ids){try{const item=await window.storage.get('quote:'+id);loadedQuotes.push(JSON.parse(item.value))}catch(error){}}}catch(error){}loadedQuotes.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));setQuotes(loadedQuotes);
    let loadedClients=[];try{const stored=await window.storage.get('clients-v3');loadedClients=JSON.parse(stored.value).map(normalizeClient)}catch(error){}

  useLayoutEffect(()=>{const shell=document.querySelector('.app-shell');if(shell){shell.scrollTop=0;shell.scrollLeft=0}},[screen]);
  const persistClients=async next=>{const sorted=[...next].sort((a,b)=>clientDisplayName(a).localeCompare(clientDisplayName(b),'it'));setClients(sorted);await window.storage.set('clients-v3',JSON.stringify(sorted))};

  const navigate=target=>{setSkipEntry(false);setScreen(target);setDraft(null);setViewingQuote(null);setEditingClient(null);setActionSheet(null)};

  useEffect(()=>{if(screen==='home'||completion||actionSheet)return;const shell=document.querySelector('.app-shell');if(!shell)return;
    let tracking=false,axis=null,startX=0,startY=0,currentX=0,lastSampleX=0,lastSampleTime=0,velocityX=0,frame=0,settleFallback=0,settleStage=null,settleListener=null;

    const paint=()=>{frame=0;const {stage,preview}=getParts();if(!tracking||axis!=='x'||!stage||!preview)return;const width=viewportWidth();const x=Math.round(Math.min(Math.max(currentX,0),width)*4)/4;const progress=Math.min(x/width,1);const previewX=-(width*.24)*(1-progress);stage.classList.add('is-swiping');preview.classList.add('is-visible','is-swiping');stage.style.setProperty('--swipe-x',`${x}px`);preview.style.setProperty('--preview-x',`${previewX}px`);preview.style.setProperty('--preview-shade',`${.12*(1-progress)}`)};
    const schedulePaint=()=>{if(!frame)frame=requestAnimationFrame(paint)};
    const settleTo=({complete})=>{if(frame){cancelAnimationFrame(frame);frame=0}const {stage,preview}=getParts();tracking=false;axis=null;if(!stage||!preview){if(complete){shell.scrollTop=0;swipeBack()}return}removeSettleListener();const width=viewportWidth();const progress=Math.min(Math.max(currentX/width,0),1);const remaining=complete?1-progress:progress;const velocityBoost=Math.min(Math.max(velocityX,0),1.8);const duration=complete?Math.round(Math.max(250,Math.min(390,285+remaining*105-velocityBoost*32))):Math.round(Math.max(235,Math.min(350,245+remaining*95)));

      stage.style.setProperty('--swipe-x',complete?`${width}px`:'0px');preview.style.setProperty('--preview-x',complete?'0px':`${-(width*.24)}px`);preview.style.setProperty('--preview-shade',complete?'0':'.12');

        document.querySelectorAll('.gesture-handoff-clone').forEach(node=>node.remove());
        const handoff=preview.cloneNode(true);handoff.classList.remove('is-swiping','is-settling');handoff.classList.add('is-visible','gesture-handoff-clone');handoff.style.setProperty('--preview-x','0px');handoff.style.setProperty('--preview-shade','0');handoff.style.removeProperty('--settle-ms');handoff.setAttribute('aria-hidden','true');document.body.appendChild(handoff);

</script>
<script>
(() => {
  const initialized=new WeakSet();let activeScroller=null;let touchStartY=0;
  function sync(scroller){scroller.classList.toggle('is-at-scroll-top',scroller.scrollTop<=.5)}
  function init(scroller){if(!scroller||initialized.has(scroller))return;initialized.add(scroller);sync(scroller);scroller.addEventListener('scroll',()=>sync(scroller),{passive:true})}

  scan();new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('touchstart',event=>{if(event.touches.length!==1)return;touchStartY=event.touches[0].clientY;activeScroller=event.target.closest?.('.app-shell')||document.querySelector('.app-shell');init(activeScroller)},{passive:true,capture:true});
